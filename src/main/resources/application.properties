spring.application.name=demo

# E-mail (envio do código de cadastro)
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase: credenciais de serviço e Web API Key (login)
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}
firebase.web-api-key=${FIREBASE_WEB_API_KEY}

# Origens do frontend permitidas pelo CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,https://sturdy-orbit-7v54p6vgg7vvfrw9j-5500.app.github.dev}

# UIDs do Firebase Authentication autorizados como administradores, separados por vírgula.
app.admin.uids=${ADMIN_UIDS:}
