spring.application.name=demo

# Firebase usa credenciais de serviço externas e uma Web API Key própria para login.
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:./firebase-service-account.json}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.email-action-continue-url=${FIREBASE_EMAIL_ACTION_CONTINUE_URL:}

